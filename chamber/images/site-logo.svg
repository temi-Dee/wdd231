<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">

  <!-- White Background -->
  <rect width="1000" height="1000" fill="white"/>

  <!-- Shield Background -->
  <polygon points="500,150 850,350 750,850 250,850 150,350"
           fill="#1E3A8A"
           stroke="#0B1F4B"
           stroke-width="20"/>

  <!-- Inner Shield -->
  <polygon points="500,220 780,380 700,800 300,800 220,380"
           fill="#3B82F6"
           stroke="#0B1F4B"
           stroke-width="15"/>

  <!-- Stylized Mascot Silhouette (Simplified Bust) -->
  <circle cx="500" cy="420" r="120"
          fill="#8B5E3C"
          stroke="#0B1F4B"
          stroke-width="15"/>

  <!-- Hair -->
  <path d="M380 380 Q500 300 620 380 Q600 330 500 310 Q400 330 380 380 Z"
        fill="#0B1F4B"/>

  <!-- Suit Shape -->
  <path d="M350 550 L650 550 L720 750 L280 750 Z"
        fill="#1E3A8A"
        stroke="#0B1F4B"
        stroke-width="15"/>

  <!-- Tie -->
  <polygon points="500,550 540,650 500,750 460,650"
           fill="#3B82F6"
           stroke="#0B1F4B"
           stroke-width="10"/>

  <!-- Top Banner -->
  <rect x="200" y="760" width="600" height="110"
        fill="#0B1F4B"
        stroke="#0B1F4B"
        stroke-width="10"
        rx="20"/>

  <!-- AYODELE Text -->
  <text x="500" y="835"
        font-family="Arial Black, Impact, sans-serif"
        font-size="90"
        fill="white"
        text-anchor="middle"
        letter-spacing="4">
        AYODELE
  </text>

  <!-- Bottom Ribbon -->
  <rect x="320" y="870" width="360" height="80"
        fill="#3B82F6"
        stroke="#0B1F4B"
        stroke-width="10"
        rx="15"/>

  <!-- DANIEL Text -->
  <text x="500" y="925"
        font-family="Arial Black, Impact, sans-serif"
        font-size="60"
        fill="#0B1F4B"
        text-anchor="middle"
        letter-spacing="3">
        DANIEL
  </text>

</svg>
