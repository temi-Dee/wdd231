<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <pattern id="foodPattern" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse" opacity="0.08">
      <text x="20" y="40" font-size="28">🍛</text>
      <text x="80" y="100" font-size="24">🌶</text>
      <text x="60" y="40" font-size="20">🍲</text>
      <text x="10" y="90" font-size="22">🥘</text>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#foodPattern)"/>
</svg>

